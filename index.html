<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خدمات الحجز الإلكتروني لدينا | حجز سريع</title>
<meta name="description" content="احجز مكافحة الحشرات، غسيل الخزانات، تنظيف الكنب والسجاد والتنظيف الشامل عبر واتساب.">
<meta property="og:title" content="خدمات الحجز الإلكتروني لدينا">
<meta property="og:description" content="حجز إلكتروني سريع يصلك تأكيده عبر واتساب.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap">
<style>
:root{--p:#0e5e6f;--pd:#08414d;--acc:#f4b942;--wa:#1fa855;--bg:#f5f8f9;--card:#fff;--b:#dde6e8;--mut:#eef3f4;--mf:#4c6469;--err:#c62828;--ink:#14282c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Tajawal",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.hero{position:relative;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;text-align:center;padding:64px 16px}
.hero h1{font-size:clamp(28px,5vw,48px);font-weight:900}
.hero p{margin-top:10px;font-size:18px;opacity:.9}
.lang{position:absolute;top:16px;inset-inline-end:16px;background:none;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:99px;padding:6px 16px;font:inherit;font-weight:700;cursor:pointer}
.quick{display:inline-block;margin-top:24px;background:var(--acc);color:var(--ink);padding:12px 24px;border-radius:99px;font-weight:700;text-decoration:none}
.wrap{max-width:1000px;margin:auto;padding:40px 16px}
h2{font-size:24px;font-weight:700;margin-bottom:20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.svc{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:20px;text-align:start;font:inherit;cursor:pointer;transition:.2s}
.svc:hover{box-shadow:0 10px 30px -12px rgba(8,65,77,.35);transform:translateY(-2px)}
.svc b{display:block}.svc span{display:block;margin-top:8px;color:var(--p);font-weight:900;font-size:20px}
.wa{display:inline-block;margin-top:20px;background:var(--wa);color:#fff;padding:12px 20px;border-radius:10px;font-weight:700;text-decoration:none}
form{max-width:640px;margin:0 auto 64px;background:var(--card);border:1px solid var(--b);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px}
.row{display:grid;gap:16px;grid-template-columns:1fr 1fr}
input:not([type=radio]):not([type=checkbox]),select,textarea{width:100%;border:1px solid var(--b);border-radius:10px;padding:10px 12px;font:inherit;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
.flex{display:flex;gap:8px}.flex button{flex-shrink:0;background:var(--p);color:#fff;border:0;border-radius:10px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer}
.pay{display:flex;gap:20px}.pay label,.agree{display:flex;gap:8px;align-items:flex-start}
.note{background:var(--mut);border-radius:10px;padding:14px;font-size:14px;color:var(--mf)}
.agree{font-size:14px}.agree input{margin-top:5px}
.err{color:var(--err);font-weight:700}
.ref{background:var(--mut);border-radius:10px;padding:12px;font-weight:700}.ref span{color:var(--p)}
.submit{background:var(--wa);color:#fff;border:0;border-radius:10px;padding:14px;font:inherit;font-size:18px;font-weight:900;cursor:pointer}
#receipt{max-width:720px;margin:0 auto 48px;padding:0 16px}
.ract{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ract button{border:1px solid var(--p);background:#fff;color:var(--p);border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.ract button.pri{background:var(--p);color:#fff}
.doc{background:#fff;border:2px solid var(--p);border-radius:16px;padding:24px}
.doc h3{color:var(--p);font-size:22px;margin-bottom:4px}
.doc table{width:100%;border-collapse:collapse;margin-top:16px}
.doc td{border-bottom:1px solid var(--b);padding:10px 6px;vertical-align:top}.doc td:first-child{font-weight:700;width:38%;color:var(--mf)}
.hide{display:none}
@media(max-width:560px){.row{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}.doc,.doc *{visibility:visible}.doc{position:absolute;top:0;left:0;right:0;border:0}}
</style>
</head>
<body>
<header class="hero">
  <button class="lang" id="lang" type="button">English</button>
  <h1 data-t="خدمات الحجز الإلكتروني لدينا">خدمات الحجز الإلكتروني لدينا</h1>
  <p data-t="احجز خلال دقيقة — يتواصل معك المندوب خلال ساعة">احجز خلال دقيقة — يتواصل معك المندوب خلال ساعة</p>
  <a class="quick" href="tel:0539635055" data-t="رقم الحجز السريع: 0539635055">رقم الحجز السريع: 0539635055</a>
</header>

<section class="wrap">
  <h2 data-t="الخدمات والأسعار">الخدمات والأسعار</h2>
  <div class="grid" id="services"></div>
  <a class="wa" id="waMore" target="_blank" rel="noreferrer" data-t="كميات أكبر من الكنب والسجاد؟ تواصل عبر واتساب">كميات أكبر من الكنب والسجاد؟ تواصل عبر واتساب</a>
</section>

<section class="wrap" style="padding-top:0">
<form id="book" novalidate>
  <h2 data-t="نموذج الحجز" style="margin:0">نموذج الحجز</h2>
  <div class="row">
    <input id="name" maxlength="100" data-ph="الاسم" placeholder="الاسم">
    <input id="phone" inputmode="tel" maxlength="10" data-ph="رقم الجوال 05xxxxxxxx" placeholder="رقم الجوال 05xxxxxxxx">
  </div>
  <select id="service"></select>
  <textarea id="details" rows="3" maxlength="500" data-ph="اكتب وصف الأغراض لديك (عدد الكنب، السجاد، مساحة المكان...)" placeholder="اكتب وصف الأغراض لديك (عدد الكنب، السجاد، مساحة المكان...)"></textarea>
  <div class="row" style="grid-template-columns:1fr 1fr">
    <select id="month"></select><select id="day"></select>
    <select id="period"></select><select id="hour"></select>
  </div>
  <div class="flex">
    <input id="location" data-ph="رابط موقعك على خرائط جوجل" placeholder="رابط موقعك على خرائط جوجل">
    <button type="button" id="locate" data-t="📍 موقعي">📍 موقعي</button>
  </div>
  <div class="pay" id="pay"></div>
  <div class="note">
    <p data-t="📞 سيتواصل معك المندوب خلال ساعة لتأكيد الحجز أو إضافة أي طلبات أخرى.">📞 سيتواصل معك المندوب خلال ساعة لتأكيد الحجز أو إضافة أي طلبات أخرى.</p>
    <p data-t="⚡ رقم الحجز السريع: 0539635055">⚡ رقم الحجز السريع: 0539635055</p>
  </div>
  <label class="agree"><input type="checkbox" id="agree"><span data-t="أقر بالموافقة على الشروط: رسوم 50 ريال في حال عدم الرد عند وصول المندوب، والتعديل أو الإلغاء قبل الموعد بـ 3 ساعات على الأقل.">أقر بالموافقة على الشروط: رسوم 50 ريال في حال عدم الرد عند وصول المندوب، والتعديل أو الإلغاء قبل الموعد بـ 3 ساعات على الأقل.</span></label>
  <p class="err hide" id="err"></p>
  <p class="ref hide" id="ref"></p>
  <button class="submit" data-t="تأكيد الحجز وإرساله عبر واتساب">تأكيد الحجز وإرساله عبر واتساب</button>
</form>
</section>

<section id="receipt" class="hide"></section>

<script>
var WA="966539635055";
var SERVICES=[["مكافحة حشرات - شقة","149 ريال","مكافحة الحشرات"],["مكافحة حشرات - فيلا","249 ريال","مكافحة الحشرات"],["غسيل وتعقيم خزانات أرضي وعلوي","250 ريال","تنظيف الخزانات"],["عرض تنظيف الكنب","149 ريال","تنظيف الأثاث"],["عرض سجاد (4 قطع)","150 ريال","تنظيف الأثاث"],["تنظيف شامل (شقق، فلل، قصور)","حسب المعاينة","النظافة العامة"],["عزل أسطح وخزانات","حسب المعاينة","عزل الخزانات"]];
var FORM_SERVICES=["مكافحة الحشرات","تنظيف الأثاث","النظافة العامة","النظافة التأهيلية","تنظيف الخزانات","عزل الخزانات"];
var MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
var HOURS={"صباحية":["8:00","9:00","10:00","11:00","12:00"],"مسائية":["4:00","5:00","6:00","7:00","8:00","9:00"]};
var PAYS=["تحويل بنكي","كاش عند الحضور"];
var EN={"خدمات الحجز الإلكتروني لدينا":"Our Online Booking Services","احجز خلال دقيقة — يتواصل معك المندوب خلال ساعة":"Book in a minute — our agent will call you within an hour","رقم الحجز السريع: 0539635055":"Quick booking: 0539635055","الخدمات والأسعار":"Services & Prices","كميات أكبر من الكنب والسجاد؟ تواصل عبر واتساب":"Larger sofa/carpet quantities? Contact us on WhatsApp","نموذج الحجز":"Booking Form","📞 سيتواصل معك المندوب خلال ساعة لتأكيد الحجز أو إضافة أي طلبات أخرى.":"📞 Our agent will call you within an hour to confirm or add any other requests.","⚡ رقم الحجز السريع: 0539635055":"⚡ Quick booking: 0539635055","أقر بالموافقة على الشروط: رسوم 50 ريال في حال عدم الرد عند وصول المندوب، والتعديل أو الإلغاء قبل الموعد بـ 3 ساعات على الأقل.":"I agree to the terms: a 50 SAR fee applies if I don't answer when the agent arrives, and changes/cancellations must be made at least 3 hours before the appointment.","تأكيد الحجز وإرساله عبر واتساب":"Confirm & send via WhatsApp","📍 موقعي":"📍 My location","الاسم":"Name","رقم الجوال 05xxxxxxxx":"Mobile 05xxxxxxxx","اكتب وصف الأغراض لديك (عدد الكنب، السجاد، مساحة المكان...)":"Describe your items (number of sofas, carpets, area size...)","رابط موقعك على خرائط جوجل":"Your Google Maps location link","تم إنشاء حجزك برقم:":"Your booking number:","— احتفظ به للمتابعة أو الشكاوى.":"— keep it for follow-up or complaints.","مكافحة حشرات - شقة":"Pest control - Apartment","مكافحة حشرات - فيلا":"Pest control - Villa","غسيل وتعقيم خزانات أرضي وعلوي":"Ground & roof tank cleaning and sterilization","عرض تنظيف الكنب":"Sofa cleaning offer","عرض سجاد (4 قطع)":"Carpet offer (4 pieces)","تنظيف شامل (شقق، فلل، قصور)":"Deep cleaning (apartments, villas, palaces)","عزل أسطح وخزانات":"Roof & tank insulation","149 ريال":"149 SAR","249 ريال":"249 SAR","250 ريال":"250 SAR","150 ريال":"150 SAR","حسب المعاينة":"Upon inspection","يناير":"January","فبراير":"February","مارس":"March","أبريل":"April","مايو":"May","يونيو":"June","يوليو":"July","أغسطس":"August","سبتمبر":"September","أكتوبر":"October","نوفمبر":"November","ديسمبر":"December","مكافحة الحشرات":"Pest control","تنظيف الأثاث":"Furniture cleaning","النظافة العامة":"General cleaning","النظافة التأهيلية":"Post-construction cleaning","تنظيف الخزانات":"Tank cleaning","عزل الخزانات":"Tank insulation","صباحية":"Morning","مسائية":"Evening","تحويل بنكي":"Bank transfer","كاش عند الحضور":"Cash on arrival","المتصفح لا يدعم تحديد الموقع":"Your browser doesn't support location","تعذر تحديد الموقع، الصق رابط الموقع من خرائط جوجل":"Couldn't get location, paste a Google Maps link","أدخل الاسم":"Enter your name","أدخل رقم جوال صحيح يبدأ بـ 05":"Enter a valid mobile starting with 05","حدد موقعك على الخريطة":"Set your location on the map","يجب الموافقة على الشروط والأحكام":"You must accept the terms and conditions"};
var lang="ar",lastErr="",booking=null;
function t(k){return lang==="en"?(EN[k]||k):k}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var now=new Date();
function opts(sel,list,val){sel.innerHTML=list.map(function(o){return '<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>'}).join("");if(val!==undefined)sel.value=val}
function year(){return +$("month").value<now.getMonth()?now.getFullYear()+1:now.getFullYear()}
function fillDays(){var m=+$("month").value,cur=+$("day").value||now.getDate(),n=new Date(year(),m+1,0).getDate(),a=[];for(var i=1;i<=n;i++)a.push([i,i]);opts($("day"),a,Math.min(cur,n))}
function fillHours(){var p=$("period").value,h=$("hour").value;opts($("hour"),HOURS[p].map(function(x){return[x,x]}),HOURS[p].indexOf(h)>-1?h:HOURS[p][0])}
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("lang").textContent=lang==="ar"?"English":"العربية";
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.dataset.t)});
  document.querySelectorAll("[data-ph]").forEach(function(e){e.placeholder=t(e.dataset.ph)});
  $("services").innerHTML=SERVICES.map(function(s,i){return '<button type="button" class="svc" data-i="'+i+'"><b>'+t(s[0])+'</b><span>'+t(s[1])+'</span></button>'}).join("");
  opts($("service"),FORM_SERVICES.map(function(s){return[s,t(s)]}),$("service").value||FORM_SERVICES[0]);
  opts($("month"),MONTHS.map(function(m,i){return[i,t(m)]}),$("month").value||now.getMonth());
  fillDays();
  opts($("period"),[["صباحية",t("صباحية")],["مسائية",t("مسائية")]],$("period").value||"صباحية");
  fillHours();
  var pv=(document.querySelector("input[name=pay]:checked")||{}).value||PAYS[0];
  $("pay").innerHTML=PAYS.map(function(p){return '<label><input type="radio" name="pay" value="'+p+'"'+(p===pv?" checked":"")+'> '+t(p)+'</label>'}).join("");
  if(lastErr)showErr(lastErr);
  if(booking){showRef();renderReceipt()}
}
function showErr(k){lastErr=k;var e=$("err");e.textContent=k?t(k):"";e.classList.toggle("hide",!k)}
function showRef(){var r=$("ref");r.innerHTML=t("تم إنشاء حجزك برقم:")+' <span>'+booking.code+'</span> '+t("— احتفظ به للمتابعة أو الشكاوى.");r.classList.remove("hide")}
function renderReceipt(){
  var b=booking,T=function(a,e){return lang==="en"?e:a};
  var rows=[[T("رقم الحجز","Booking no."),b.code],[T("الاسم","Name"),b.name],[T("رقم الجوال","Mobile"),b.phone],[T("الخدمة المطلوبة","Service"),t(b.service)],[T("التاريخ","Date"),b.day+" "+t(MONTHS[b.month])+" "+b.year],[T("الفترة والساعة","Time"),t(b.period)+" — "+b.hour],[T("طريقة الدفع","Payment"),t(b.pay)],[T("الموقع","Location"),b.location],[T("وصف الأغراض","Items description"),b.details||"—"]];
  var r=$("receipt");
  r.innerHTML='<h2>'+T("نسخة الحجز","Booking copy")+'</h2><div class="ract"><button type="button" class="pri" id="print">'+T("طباعة / حفظ PDF","Print / Save PDF")+'</button><button type="button" id="resend">'+T("إعادة الإرسال عبر واتساب","Resend via WhatsApp")+'</button></div><div class="doc"><h3>'+T("إيصال حجز","Booking receipt")+'</h3><p>'+T("شكراً لثقتك بنا","Thank you for your trust")+'</p><table>'+rows.map(function(x){return '<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>'}).join("")+'</table></div>';
  r.classList.remove("hide");
  $("print").onclick=function(){window.print()};
  $("resend").onclick=function(){window.open(waUrl(),"_blank")};
}
function waUrl(){var b=booking;var msg=["🧾 حجز جديد - رقم الحجز: "+b.code,"👤 العميل: "+b.name,"📱 الجوال: "+b.phone,"🛠️ الخدمة: "+b.service,"📝 وصف الأغراض: "+(b.details||"-"),"📅 الموعد: "+b.day+" "+MONTHS[b.month]+" "+b.year+" - الفترة "+b.period+" - الساعة "+b.hour,"📍 الموقع: "+b.location,"💳 الدفع: "+b.pay,"✅ وافق العميل على الشروط والأحكام"].join("\n");return "https://wa.me/"+WA+"?text="+encodeURIComponent(msg)}

$("lang").onclick=function(){lang=lang==="ar"?"en":"ar";render()};
$("services").onclick=function(e){var b=e.target.closest(".svc");if(!b)return;$("service").value=SERVICES[b.dataset.i][2];$("book").scrollIntoView({behavior:"smooth"})};
$("month").onchange=fillDays;$("period").onchange=fillHours;
$("waMore").href="https://wa.me/"+WA+"?text="+encodeURIComponent("أرغب بعرض سعر لكميات أكبر من الكنب/السجاد");
$("locate").onclick=function(){
  if(!navigator.geolocation)return showErr("المتصفح لا يدعم تحديد الموقع");
  navigator.geolocation.getCurrentPosition(function(p){$("location").value="https://www.google.com/maps?q="+p.coords.latitude+","+p.coords.longitude;showErr("")},function(){showErr("تعذر تحديد الموقع، الصق رابط الموقع من خرائط جوجل")});
};
$("book").onsubmit=function(e){
  e.preventDefault();showErr("");
  var name=$("name").value.trim(),phone=$("phone").value.trim(),loc=$("location").value.trim();
  if(name.length<2)return showErr("أدخل الاسم");
  if(!/^05\d{8}$/.test(phone))return showErr("أدخل رقم جوال صحيح يبدأ بـ 05");
  if(!loc)return showErr("حدد موقعك على الخريطة");
  if(!$("agree").checked)return showErr("يجب الموافقة على الشروط والأحكام");
  booking={code:"BK-"+Math.floor(100000+Math.random()*900000),name:name,phone:phone,service:$("service").value,details:$("details").value.trim().slice(0,500),month:+$("month").value,day:+$("day").value,year:year(),period:$("period").value,hour:$("hour").value,location:loc,pay:document.querySelector("input[name=pay]:checked").value};
  try{var l=JSON.parse(localStorage.getItem("bookings")||"[]");if(!Array.isArray(l))l=[];l.push(Object.assign({at:new Date().toISOString()},booking));localStorage.setItem("bookings",JSON.stringify(l))}catch(x){}
  showRef();renderReceipt();
  window.open(waUrl(),"_blank");
};
render();
</script>
</body>
</html>
